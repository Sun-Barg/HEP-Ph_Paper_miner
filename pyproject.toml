[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hepph-paper-miner"
version = "0.0.1"
description = "An MCP server for searching arXiv and reading papers section by section, with a minimal tool-calling loop and a small evaluation set (work in progress)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    # Lower bound: the version this was written and tested against.
    # Upper bound: the SDK makes breaking changes only in a new major.
    "mcp>=2.3,<3",
    # Both come with mcp. They are named because this project imports them itself.
    "httpx2>=2.16,<3",
    "pydantic>=2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests marked "network" send real requests to arXiv. Run them on purpose: uv run pytest -m network
addopts = "-m 'not network'"
markers = ["network: sends real requests to arXiv (not run by default)"]

[tool.ruff]
# The code is formatted with "ruff format". ruff is not a dependency: run it with uvx.
line-length = 100
